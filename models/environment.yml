# Conda environment of SAM-model (folder models/), exact versions from conda-forge.
# Works on Mac (Intel or Apple silicon), Windows and Linux:
#
#   conda env create -f models/environment.yml
#   conda activate mtah
#
# Same versions as requirements.txt (for those who use pip instead of conda).
name: mtah
channels:
  - conda-forge
dependencies:
  - python=3.11
  - numpy=2.4.6
  - pandas=3.1.1
  - pyarrow=26.0.1
  - scikit-learn=1.9.1
  - scipy=1.17.1
  - joblib=1.6.0
  - numba=0.68.1
  - llvmlite=0.50.0
  - pytorch=2.14.1
  - lightgbm=4.7.0
